openapi: 3.1.0
info:
  title: Luna Pages internal API
  version: 0.1.0
  summary: The dashboard's editor, for luna-dashboard only.
  description: |
    The same editor contract, publishing and read API as `/v1` (`/openapi.yaml`), for the
    dashboard's GrapesJS editor and previews (`draft=1` is always allowed here): the dashboard proxies its developer's requests here after checking that the
    application is theirs. Every request carries the dashboard's service token
    (`LUNA_DASHBOARD_TOKEN` of luna-pages) in `Authorization: Bearer`; the application comes from
    the path. nginx does not route `/internal/`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://luna-pages:8080
    description: the service network (compose, Kubernetes)
security:
  - serviceToken: []
tags:
  - name: editor
    description: Sites, layouts, templates and pages (drafts).
  - name: publish
    description: Making drafts live, revisions, restoring.
  - name: read
    description: Published content and draft previews.
  - name: content
    description: "grapesjs-storage's REST contract (its openapi.yaml): templates as their fields, entries with values by field name (pages:write)."

paths:
  /internal/v1/apps/{app}/editor/site:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      tags: [editor]
      summary: The site
      description: The application's site with its draft project (global CSS, symbols); created empty on first use.
      operationId: internalGetSite
      responses:
        "200":
          description: The site.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [editor]
      summary: Change the site
      operationId: internalPutSite
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteWrite" }
      responses:
        "200":
          description: The changed site.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "412": { $ref: "#/components/responses/Precondition" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/editor/{kind}:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - $ref: "#/components/parameters/Kind"
    get:
      tags: [editor]
      summary: List records
      description: Every layout, template or page of the application without projects, oldest first (pages by position). The `items` shape is what grapesjs-pages' sync reads.
      operationId: internalListRecords
      responses:
        "200":
          description: The records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Record" }
                required: [items]
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/editor/{kind}/{id}:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - $ref: "#/components/parameters/Kind"
      - $ref: "#/components/parameters/ID"
    get:
      tags: [editor]
      summary: Get a record
      description: The record with its draft project in `data` and, for a page, its draft values.
      operationId: internalGetRecord
      responses:
        "200":
          description: The record.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordWithData" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [editor]
      summary: Create or replace a record
      operationId: internalPutRecord
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordWrite" }
      responses:
        "200":
          description: Replaced; the new version.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "201":
          description: Created.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [editor]
      summary: Delete a record
      description: Deletes it with its content. A deleted layout leaves its pages without one; a page's children lose their parent.
      operationId: internalDeleteRecord
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted. }
        "409":
          description: A template that pages still use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/editor/{kind}/{id}/publish:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
      - { $ref: "#/components/parameters/Kind" }
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [publish]
      summary: Publish a record
      operationId: internalPublishRecord
      description: "The published HTML and CSS. The HTML is sanitized here (no scripts, no event handlers, no `javascript:` URLs, iframes from the allowed hosts only; the site settings `custom_code` and `iframe_hosts` widen that), the CSS too. A layout needs a `<page-slot>` or `<luna-slot>` (or `data-page-slot` / `data-luna-slot`). An entry sends no body: its draft values are checked against its template's fields and published; its template must be published. `data` (the project) is saved as the draft first. The version moves on."
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishWrite" }
      responses:
        "200":
          description: "Live; the new revision and any warnings (template fields without an element)."
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Published" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/editor/site/publish:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
    post:
      tags: [publish]
      summary: Publish the site's CSS
      operationId: internalPublishSite
      description: "The site's global CSS (sanitized), first in every page's CSS."
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishWrite" }
      responses:
        "200":
          description: "Live."
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedSite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "412": { $ref: "#/components/responses/Precondition" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/editor/pages/{id}/unpublish:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [publish]
      summary: Unpublish a page
      operationId: internalUnpublishPage
      description: "Takes the page off the site; its revisions stay. The version moves on."
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: "The page, now a draft."
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/editor/{kind}/{id}/revisions:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
      - { $ref: "#/components/parameters/Kind" }
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [publish]
      summary: List revisions
      operationId: internalListRevisions
      description: "The published revisions of a record, newest (the live one) first; the newest 20 are kept."
      responses:
        "200":
          description: "The revisions."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revisions" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/editor/site/revisions:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
    get:
      tags: [publish]
      summary: List the site's revisions
      operationId: internalListSiteRevisions
      responses:
        "200":
          description: "The revisions."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revisions" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/editor/{kind}/{id}/revisions/{revision}/restore:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
      - { $ref: "#/components/parameters/Kind" }
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/Revision" }
    post:
      tags: [publish]
      summary: Restore a revision
      operationId: internalRestoreRevision
      description: "Copies the revision's project into the draft, for the editor to reopen; it is not published. The version moves on."
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: "The record with the restored draft in `data`."
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordWithData" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/site:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
    get:
      tags: [read]
      summary: The site
      operationId: internalSite
      description: "Name, settings, the published global CSS and the menu (published pages with the value `in_menu: true`)."
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: "The site."
          headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSite" }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/render:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
    get:
      tags: [read]
      summary: Render a page
      operationId: internalRender
      description: "The page's finished HTML (an entry's template filled with its values) in its layout's slot, the CSS in order (site, layout, page or template), SEO values and the client's own values. Published pages only; `draft=1` fills an entry with its draft values (needs `pages:write`; designs are always the published ones)."
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - { $ref: "#/components/parameters/PageID" }
        - { $ref: "#/components/parameters/Draft" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: "The page. `Cache-Control: public, max-age=60` and an ETag; drafts `no-store`."
          headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rendered" }
        "304": { description: Not modified (the ETag in If-None-Match is current). }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/pages:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
    get:
      tags: [read]
      summary: List published pages
      operationId: internalPages
      description: "Published pages with their values, for catalogues and menus."
      parameters:
        - { $ref: "#/components/parameters/Template" }
        - { $ref: "#/components/parameters/Parent" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { $ref: "#/components/parameters/Sort" }
      responses:
        "200":
          description: "A page of results."
          headers: { Cache-Control: { $ref: "#/components/headers/CacheControl" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageList" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/pages/{id}:
    parameters:
      - { $ref: "#/components/parameters/AppID" }
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [read]
      summary: Get a published page
      operationId: internalPage
      description: "One published page's header and values, without HTML (for a site that renders itself)."
      responses:
        "200":
          description: "The page."
          headers: { Cache-Control: { $ref: "#/components/headers/CacheControl" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/v1/apps/{app}/content/templates:
    get:
      tags:
      - content
      summary: List templates
      operationId: internalContentListTemplates
      description: Every template with its fields, without the design.
      responses:
        '200':
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentTemplate'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthorized'
    parameters:
    - $ref: '#/components/parameters/AppID'
  /internal/v1/apps/{app}/content/templates/{id}:
    parameters:
    - $ref: '#/components/parameters/AppID'
    - $ref: '#/components/parameters/ContentID'
    get:
      tags:
      - content
      summary: Get a template
      operationId: internalContentGetTemplate
      description: The template with its design (`data`) when the server has one.
      responses:
        '200':
          description: The template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentTemplateWithData'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - content
      summary: Save a template's fields
      operationId: internalContentSaveTemplate
      description: Replaces the fields; `name` is required to create one; `data` replaces the design when sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentTemplateWrite'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentTemplate'
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentTemplate'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/v1/apps/{app}/content/entries:
    get:
      tags:
      - content
      summary: List entries
      operationId: internalContentListEntries
      description: Entries of a template (all without `template`); `values` may be left out.
      parameters:
      - name: template
        in: query
        schema:
          type: string
      responses:
        '200':
          description: The entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentEntry'
                required:
                - items
        '401':
          $ref: '#/components/responses/Unauthorized'
    parameters:
    - $ref: '#/components/parameters/AppID'
  /internal/v1/apps/{app}/content/entries/{id}:
    parameters:
    - $ref: '#/components/parameters/AppID'
    - $ref: '#/components/parameters/ContentID'
    get:
      tags:
      - content
      summary: Get an entry
      operationId: internalContentGetEntry
      responses:
        '200':
          description: The entry with its values.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - content
      summary: Create or replace an entry
      operationId: internalContentPutEntry
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentEntryWrite'
      responses:
        '200':
          description: Saved.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '201':
          description: Created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '412':
          $ref: '#/components/responses/Precondition'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - content
      summary: Delete an entry
      operationId: internalContentDeleteEntry
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/Precondition'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/v1/apps/{app}/content/entries/{id}/publish:
    parameters:
    - $ref: '#/components/parameters/AppID'
    - $ref: '#/components/parameters/ContentID'
    post:
      tags:
      - content
      summary: Publish an entry
      operationId: internalContentPublishEntry
      description: Optional for a server; the values go live (the server checks them against the fields).
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Live.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentEntry'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/Precondition'
        '422':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  parameters:
    AppID:
      name: app
      in: path
      required: true
      description: The application's id in the dashboard.
      schema: { type: string, format: uuid }
    Kind:
      name: kind
      in: path
      required: true
      description: The kind of record.
      schema: { type: string, enum: [layouts, templates, pages] }
    ID:
      name: id
      in: path
      required: true
      description: The record's id, a UUID the editor generates (stable across devices; `PUT` creates).
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The version the edits are based on, quoted like an ETag (`"7"`). Omitted = unconditional (the editor's "keep mine").
      schema: { type: string, example: '"7"' }

    Revision:
      name: revision
      in: path
      required: true
      description: A revision number from the revisions list.
      schema: { type: integer, minimum: 1 }
    Slug:
      name: slug
      in: query
      description: "The page's slug, e.g. `/products/coffee-grinder` (`/` the home page). Either slug or id."
      schema: { type: string }
    PageID:
      name: id
      in: query
      description: The page's id, instead of the slug.
      schema: { type: string, format: uuid }
    Draft:
      name: draft
      in: query
      description: "`1`: an entry with its draft values, also when the page is not live (`pages:write`)."
      schema: { type: string, enum: ["0", "1"] }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag from an earlier answer; `304` while it is current.
      schema: { type: string }
    Template:
      name: template
      in: query
      description: Only entries of this template, by id or name (case-insensitive).
      schema: { type: string, example: product }
    Parent:
      name: parent
      in: query
      description: Only children of this page.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: A leading `-` sorts descending.
      schema: { type: string, enum: [published_at, -published_at, title, -title, slug, -slug, position, -position], default: -published_at }

    ContentID:
      name: id
      in: path
      required: true
      description: The record's id (a UUID the editor makes).
      schema:
        type: string
        format: uuid

  headers:
    ETag:
      description: The record's version, quoted.
      schema: { type: string, example: '"8"' }

    CacheControl:
      description: "`public, max-age=60` for published content, `no-store` for drafts."
      schema: { type: string }

  responses:
    NotFound:
      description: No such record in this application.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Precondition:
      description: "`If-Match` does not match the current version, or the record is gone. Reload, merge, or write without `If-Match`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request body is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    BadRequest:
      description: Not JSON, or a malformed `If-Match`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The body is larger than 4 MiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No or a wrong service token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    ValidationError:
      type: object
      properties:
        error: { type: string, example: The given data was invalid. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
      required: [error, errors]

    Project:
      type: object
      description: A GrapesJS project (`editor.getProjectData()`), at most 2 MiB, stored as it is.
      additionalProperties: true

    Field:
      type: object
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$", example: price }
        type: { type: string, enum: [text, richtext, image, link, number, boolean, date, select, list] }
        label: { type: string, maxLength: 200 }
        required: { type: boolean }
        default: { description: Any JSON value. }
        options:
          type: array
          items: { type: string }
          description: The choices of a `select`.
        format: { type: string, description: "A number or date format, e.g. `0.00`." }
        fields:
          type: array
          items: { $ref: "#/components/schemas/Field" }
          description: The fields of a `list` item (one level).
      required: [name, type]

    Record:
      type: object
      description: A layout, template or page. Pages carry the page fields, templates `fields`.
      properties:
        kind: { type: string, enum: [layout, template, page] }
        id: { type: string, format: uuid }
        name: { type: string, description: The name; a page's title. }
        version: { type: integer, description: Changes on every write. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        slug: { type: string, example: /products/coffee-grinder }
        page_kind: { type: string, enum: [free, entry] }
        status: { type: string, enum: [draft, published, archived] }
        layout_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        position: { type: integer }
        fields:
          type: array
          items: { $ref: "#/components/schemas/Field" }
      required: [kind, id, name, version, created_at, updated_at]

    RecordWithData:
      allOf:
        - $ref: "#/components/schemas/Record"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Project" }
            values:
              type: object
              description: A page's draft values by key (`field.<name>`, `seo.<name>`, the client's own keys).
              additionalProperties: true

    RecordWrite:
      type: object
      description: |
        What `grapesjs-pages` v1 sends (`name`, `data`; other properties such as `id` and
        `updatedAt` are ignored) plus the optional v2 properties. Omitted page references
        keep their value; a new page without `slug` gets one from its name.
      properties:
        name: { type: string, maxLength: 200 }
        data: { $ref: "#/components/schemas/Project" }
        slug: { type: string, description: "`/` for the home page, else `/a/b-c` of lower-case letters, digits and dashes." }
        layout_id: { type: [string, "null"], format: uuid }
        template_id: { type: [string, "null"], format: uuid, description: Makes the page an entry of the template. }
        parent_id: { type: [string, "null"], format: uuid }
        position: { type: integer }
        values:
          type: object
          maxProperties: 200
          description: Keys to set (`field.price`, `seo.description`…); `null` deletes a key; keys not sent stay. 64 KiB a value.
          additionalProperties: true
        fields:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Field" }
          description: A template's fields.
      required: [name]

    Site:
      type: object
      properties:
        name: { type: string }
        settings: { type: object, additionalProperties: true, description: "Languages, domain, fonts…" }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        data: { $ref: "#/components/schemas/Project" }
      required: [name, settings, version, updated_at]

    SiteWrite:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        settings: { type: object, additionalProperties: true }
        data: { $ref: "#/components/schemas/Project" }

    PublishWrite:
      type: object
      description: "`editor.getHtml()` and `editor.getCss()`; an entry sends nothing."
      properties:
        html: { type: string, maxLength: 2097152 }
        css: { type: string, maxLength: 1048576 }
        data: { $ref: "#/components/schemas/Project" }

    Published:
      type: object
      properties:
        record: { $ref: "#/components/schemas/Record" }
        revision: { type: integer, description: "The new revision (0 for an entry, whose design is its template's)." }
        warnings: { type: array, items: { type: string } }
      required: [record, revision, warnings]

    PublishedSite:
      type: object
      properties:
        record: { $ref: "#/components/schemas/Site" }
        revision: { type: integer }
        warnings: { type: array, items: { type: string } }
      required: [record, revision, warnings]

    Revisions:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              revision: { type: integer }
              created_at: { type: string, format: date-time }
              created_by: { type: string, description: "`key:<key id>` or `dashboard`." }
              live: { type: boolean }
      required: [items]

    Values:
      type: object
      additionalProperties: true

    Rendered:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        kind: { type: string, enum: [free, entry] }
        template_id: { type: [string, "null"], format: uuid }
        published_at: { type: [string, "null"], format: date-time }
        html: { type: string, description: "The page in its layout, sanitized." }
        css: { type: string, description: "Site, layout and page (or template) CSS, in that order." }
        seo: { $ref: "#/components/schemas/Values", description: "The `seo.<name>` values without the prefix." }
        meta: { $ref: "#/components/schemas/Values", description: The client's own values. }
        version: { type: string, description: The ETag without quotes. }
        draft: { type: boolean }
      required: [id, slug, title, kind, html, css, seo, meta, version]

    PageSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        kind: { type: string, enum: [free, entry] }
        template_id: { type: [string, "null"], format: uuid }
        template: { type: [string, "null"], description: The template's name. }
        parent_id: { type: [string, "null"], format: uuid }
        position: { type: integer }
        published_at: { type: [string, "null"], format: date-time }
        fields: { $ref: "#/components/schemas/Values", description: "The field values by name." }
        seo: { $ref: "#/components/schemas/Values" }
        meta: { $ref: "#/components/schemas/Values" }
      required: [id, slug, title, kind, fields, seo, meta]

    PageList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PageSummary" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
      required: [items, page, per_page, total]

    PublicSite:
      type: object
      properties:
        name: { type: string }
        settings: { type: object, additionalProperties: true, description: The site's settings; public. }
        css: { type: string }
        menu:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              slug: { type: string }
              title: { type: string }
              parent_id: { type: [string, "null"], format: uuid }
              position: { type: integer }
        version: { type: string }
      required: [name, settings, css, menu, version]

    ContentTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        version:
          type:
          - string
          - integer
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - fields
    ContentTemplateWithData:
      allOf:
      - $ref: '#/components/schemas/ContentTemplate'
      - type: object
        properties:
          data:
            type:
            - object
            - 'null'
            description: The GrapesJS project of the design.
    ContentTemplateWrite:
      type: object
      properties:
        name:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        data:
          type:
          - object
          - 'null'
      required:
      - fields
    ContentEntry:
      type: object
      properties:
        id:
          type: string
        template_id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        values:
          $ref: '#/components/schemas/Values'
        version:
          type:
          - string
          - integer
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - template_id
      - name
    ContentEntryWrite:
      type: object
      properties:
        template_id:
          type: string
        name:
          type: string
        slug:
          type: string
        values:
          $ref: '#/components/schemas/Values'
      required:
      - template_id
      - name
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: The dashboard's service token (`LUNA_DASHBOARD_TOKEN` of luna-pages).
