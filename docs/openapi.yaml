openapi: 3.1.0
info:
  title: Luna Pages API
  version: 0.1.0
  summary: A small CMS per application registered in the Luna dashboard.
  description: |
    Every `/v1` request carries an API key from the dashboard in `X-API-Key`; the key decides the
    application. The editor contract (`/v1/editor`) needs `pages:write` and therefore a server
    key: a client's own admin calls it through its backend. It is the contract of the GrapesJS
    plugins `grapesjs-pages` (v2; v1 clients work unchanged with this base URL) and
    `grapesjs-storage`: ids made by the editor, a `version` on every record that changes on every
    write, conditional writes with `If-Match` (`412` when the version moved on).

    Publishing (`/v1/editor/…/publish`) sanitizes the editor's HTML and CSS and keeps the newest 20
    revisions. The read API (`/v1/site`, `/v1/render`, `/v1/pages`) needs `pages:read`, which browser
    keys may hold: it shows published content only, with an ETag (`304` on `If-None-Match`) and
    `Cache-Control: public, max-age=60`.

    Errors are `{"error": "…"}`; validation errors are `422` with `errors` by field.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://pages.luna.local
    description: local, through nginx
  - url: http://localhost:8082
    description: local (gtr dev)
security:
  - apiKey: []
tags:
  - name: editor
    description: Sites, layouts, templates and pages as the editor writes them (drafts).
  - name: publish
    description: Making drafts live, revisions, restoring (pages:write).
  - name: read
    description: Published content for the site (pages:read; browser keys allowed).
  - name: service
    description: Liveness and key checks.

paths:
  /healthz:
    get:
      tags: [service]
      summary: Liveness
      operationId: healthz
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  app: { type: string, example: luna-pages }

  /v1/ping:
    get:
      tags: [service]
      summary: Which application a key belongs to
      operationId: ping
      description: Any valid key.
      responses:
        "200":
          description: The key's application and scopes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_id: { type: string, format: uuid }
                  app_name: { type: string }
                  scopes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/site:
    parameters: []
    get:
      tags: [editor]
      summary: The site
      description: The application's site with its draft project (global CSS, symbols); created empty on first use.
      operationId: getSite
      responses:
        "200":
          description: The site.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }
    put:
      tags: [editor]
      summary: Change the site
      operationId: putSite
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteWrite" }
      responses:
        "200":
          description: The changed site.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "412": { $ref: "#/components/responses/Precondition" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/{kind}:
    parameters:
      - $ref: "#/components/parameters/Kind"
    get:
      tags: [editor]
      summary: List records
      description: Every layout, template or page of the application without projects, oldest first (pages by position). The `items` shape is what grapesjs-pages' sync reads.
      operationId: listRecords
      responses:
        "200":
          description: The records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Record" }
                required: [items]
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/{kind}/{id}:
    parameters:
      - $ref: "#/components/parameters/Kind"
      - $ref: "#/components/parameters/ID"
    get:
      tags: [editor]
      summary: Get a record
      description: The record with its draft project in `data` and, for a page, its draft values.
      operationId: getRecord
      responses:
        "200":
          description: The record.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordWithData" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }
    put:
      tags: [editor]
      summary: Create or replace a record
      operationId: putRecord
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordWrite" }
      responses:
        "200":
          description: Replaced; the new version.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "201":
          description: Created.
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }
    delete:
      tags: [editor]
      summary: Delete a record
      description: Deletes it with its content. A deleted layout leaves its pages without one; a page's children lose their parent.
      operationId: deleteRecord
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204": { description: Deleted. }
        "409":
          description: A template that pages still use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/{kind}/{id}/publish:
    parameters:
      - { $ref: "#/components/parameters/Kind" }
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [publish]
      summary: Publish a record
      operationId: publishRecord
      description: "The published HTML and CSS. The HTML is sanitized here (no scripts, no event handlers, no `javascript:` URLs, iframes from the allowed hosts only; the site settings `custom_code` and `iframe_hosts` widen that), the CSS too. A layout needs a `<page-slot>` or `<luna-slot>` (or `data-page-slot` / `data-luna-slot`). An entry sends no body: its draft values are checked against its template's fields and published; its template must be published. `data` (the project) is saved as the draft first. The version moves on."
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishWrite" }
      responses:
        "200":
          description: "Live; the new revision and any warnings (template fields without an element)."
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Published" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/site/publish:
    parameters: []
    post:
      tags: [publish]
      summary: Publish the site's CSS
      operationId: publishSite
      description: "The site's global CSS (sanitized), first in every page's CSS."
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishWrite" }
      responses:
        "200":
          description: "Live."
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedSite" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "412": { $ref: "#/components/responses/Precondition" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/pages/{id}/unpublish:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    post:
      tags: [publish]
      summary: Unpublish a page
      operationId: unpublishPage
      description: "Takes the page off the site; its revisions stay. The version moves on."
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: "The page, now a draft."
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Record" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/{kind}/{id}/revisions:
    parameters:
      - { $ref: "#/components/parameters/Kind" }
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [publish]
      summary: List revisions
      operationId: listRevisions
      description: "The published revisions of a record, newest (the live one) first; the newest 20 are kept."
      responses:
        "200":
          description: "The revisions."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revisions" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/site/revisions:
    parameters: []
    get:
      tags: [publish]
      summary: List the site's revisions
      operationId: listSiteRevisions
      responses:
        "200":
          description: "The revisions."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revisions" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/editor/{kind}/{id}/revisions/{revision}/restore:
    parameters:
      - { $ref: "#/components/parameters/Kind" }
      - { $ref: "#/components/parameters/ID" }
      - { $ref: "#/components/parameters/Revision" }
    post:
      tags: [publish]
      summary: Restore a revision
      operationId: restoreRevision
      description: "Copies the revision's project into the draft, for the editor to reopen; it is not published. The version moves on."
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
      responses:
        "200":
          description: "The record with the restored draft in `data`."
          headers: { ETag: { $ref: "#/components/headers/ETag" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordWithData" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/Precondition" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/site:
    parameters: []
    get:
      tags: [read]
      summary: The site
      operationId: site
      description: "Name, settings, the published global CSS and the menu (published pages with the value `in_menu: true`)."
      parameters:
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: "The site."
          headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSite" }
        "304": { description: Not modified. }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/ReadForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/render:
    parameters: []
    get:
      tags: [read]
      summary: Render a page
      operationId: render
      description: "The page's finished HTML (an entry's template filled with its values) in its layout's slot, the CSS in order (site, layout, page or template), SEO values and the client's own values. Published pages only; `draft=1` fills an entry with its draft values (needs `pages:write`; designs are always the published ones)."
      parameters:
        - { $ref: "#/components/parameters/Slug" }
        - { $ref: "#/components/parameters/PageID" }
        - { $ref: "#/components/parameters/Draft" }
        - { $ref: "#/components/parameters/IfNoneMatch" }
      responses:
        "200":
          description: "The page. `Cache-Control: public, max-age=60` and an ETag; drafts `no-store`."
          headers: { ETag: { $ref: "#/components/headers/ETag" }, Cache-Control: { $ref: "#/components/headers/CacheControl" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rendered" }
        "304": { description: Not modified (the ETag in If-None-Match is current). }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/ReadForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/pages:
    parameters: []
    get:
      tags: [read]
      summary: List published pages
      operationId: pages
      description: "Published pages with their values, for catalogues and menus."
      parameters:
        - { $ref: "#/components/parameters/Template" }
        - { $ref: "#/components/parameters/Parent" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { $ref: "#/components/parameters/Sort" }
      responses:
        "200":
          description: "A page of results."
          headers: { Cache-Control: { $ref: "#/components/headers/CacheControl" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageList" }
        "422": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/ReadForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/pages/{id}:
    parameters:
      - { $ref: "#/components/parameters/ID" }
    get:
      tags: [read]
      summary: Get a published page
      operationId: page
      description: "One published page's header and values, without HTML (for a site that renders itself)."
      responses:
        "200":
          description: "The page."
          headers: { Cache-Control: { $ref: "#/components/headers/CacheControl" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/ReadForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

components:
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      description: The kind of record.
      schema: { type: string, enum: [layouts, templates, pages] }
    ID:
      name: id
      in: path
      required: true
      description: The record's id, a UUID the editor generates (stable across devices; `PUT` creates).
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The version the edits are based on, quoted like an ETag (`"7"`). Omitted = unconditional (the editor's "keep mine").
      schema: { type: string, example: '"7"' }

    Revision:
      name: revision
      in: path
      required: true
      description: A revision number from the revisions list.
      schema: { type: integer, minimum: 1 }
    Slug:
      name: slug
      in: query
      description: "The page's slug, e.g. `/products/coffee-grinder` (`/` the home page). Either slug or id."
      schema: { type: string }
    PageID:
      name: id
      in: query
      description: The page's id, instead of the slug.
      schema: { type: string, format: uuid }
    Draft:
      name: draft
      in: query
      description: "`1`: an entry with its draft values, also when the page is not live (`pages:write`)."
      schema: { type: string, enum: ["0", "1"] }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: An ETag from an earlier answer; `304` while it is current.
      schema: { type: string }
    Template:
      name: template
      in: query
      description: Only entries of this template, by id or name (case-insensitive).
      schema: { type: string, example: product }
    Parent:
      name: parent
      in: query
      description: Only children of this page.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: A leading `-` sorts descending.
      schema: { type: string, enum: [published_at, -published_at, title, -title, slug, -slug, position, -position], default: -published_at }

  headers:
    ETag:
      description: The record's version, quoted.
      schema: { type: string, example: '"8"' }

    CacheControl:
      description: "`public, max-age=60` for published content, `no-store` for drafts."
      schema: { type: string }

  responses:
    NotFound:
      description: No such record in this application.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Precondition:
      description: "`If-Match` does not match the current version, or the record is gone. Reload, merge, or write without `If-Match`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request body is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    BadRequest:
      description: Not JSON, or a malformed `If-Match`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: The body is larger than 4 MiB.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeyInvalid:
      description: No API key, or an unknown, revoked or malformed one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeyForbidden:
      description: The key lacks `pages:write`, a browser key from another origin, a server key sent from a browser, or an address outside the key's networks.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeysUnavailable:
      description: The dashboard cannot be asked about the key right now.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    ReadForbidden:
      description: The key lacks `pages:read` (or `pages:write` for drafts), a browser key from another origin, a server key sent from a browser, or an address outside the key's networks.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    ValidationError:
      type: object
      properties:
        error: { type: string, example: The given data was invalid. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
      required: [error, errors]

    Project:
      type: object
      description: A GrapesJS project (`editor.getProjectData()`), at most 2 MiB, stored as it is.
      additionalProperties: true

    Field:
      type: object
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9_]{0,63}$", example: price }
        type: { type: string, enum: [text, richtext, image, link, number, boolean, date, select, list] }
        label: { type: string, maxLength: 200 }
        required: { type: boolean }
        default: { description: Any JSON value. }
        options:
          type: array
          items: { type: string }
          description: The choices of a `select`.
        format: { type: string, description: "A number or date format, e.g. `0.00`." }
        fields:
          type: array
          items: { $ref: "#/components/schemas/Field" }
          description: The fields of a `list` item (one level).
      required: [name, type]

    Record:
      type: object
      description: A layout, template or page. Pages carry the page fields, templates `fields`.
      properties:
        kind: { type: string, enum: [layout, template, page] }
        id: { type: string, format: uuid }
        name: { type: string, description: The name; a page's title. }
        version: { type: integer, description: Changes on every write. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        slug: { type: string, example: /products/coffee-grinder }
        page_kind: { type: string, enum: [free, entry] }
        status: { type: string, enum: [draft, published, archived] }
        layout_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        position: { type: integer }
        fields:
          type: array
          items: { $ref: "#/components/schemas/Field" }
      required: [kind, id, name, version, created_at, updated_at]

    RecordWithData:
      allOf:
        - $ref: "#/components/schemas/Record"
        - type: object
          properties:
            data: { $ref: "#/components/schemas/Project" }
            values:
              type: object
              description: A page's draft values by key (`field.<name>`, `seo.<name>`, the client's own keys).
              additionalProperties: true

    RecordWrite:
      type: object
      description: |
        What `grapesjs-pages` v1 sends (`name`, `data`; other properties such as `id` and
        `updatedAt` are ignored) plus the optional v2 properties. Omitted page references
        keep their value; a new page without `slug` gets one from its name.
      properties:
        name: { type: string, maxLength: 200 }
        data: { $ref: "#/components/schemas/Project" }
        slug: { type: string, description: "`/` for the home page, else `/a/b-c` of lower-case letters, digits and dashes." }
        layout_id: { type: [string, "null"], format: uuid }
        template_id: { type: [string, "null"], format: uuid, description: Makes the page an entry of the template. }
        parent_id: { type: [string, "null"], format: uuid }
        position: { type: integer }
        values:
          type: object
          maxProperties: 200
          description: Keys to set (`field.price`, `seo.description`…); `null` deletes a key; keys not sent stay. 64 KiB a value.
          additionalProperties: true
        fields:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Field" }
          description: A template's fields.
      required: [name]

    Site:
      type: object
      properties:
        name: { type: string }
        settings: { type: object, additionalProperties: true, description: "Languages, domain, fonts…" }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        data: { $ref: "#/components/schemas/Project" }
      required: [name, settings, version, updated_at]

    SiteWrite:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        settings: { type: object, additionalProperties: true }
        data: { $ref: "#/components/schemas/Project" }

    PublishWrite:
      type: object
      description: "`editor.getHtml()` and `editor.getCss()`; an entry sends nothing."
      properties:
        html: { type: string, maxLength: 2097152 }
        css: { type: string, maxLength: 1048576 }
        data: { $ref: "#/components/schemas/Project" }

    Published:
      type: object
      properties:
        record: { $ref: "#/components/schemas/Record" }
        revision: { type: integer, description: "The new revision (0 for an entry, whose design is its template's)." }
        warnings: { type: array, items: { type: string } }
      required: [record, revision, warnings]

    PublishedSite:
      type: object
      properties:
        record: { $ref: "#/components/schemas/Site" }
        revision: { type: integer }
        warnings: { type: array, items: { type: string } }
      required: [record, revision, warnings]

    Revisions:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              revision: { type: integer }
              created_at: { type: string, format: date-time }
              created_by: { type: string, description: "`key:<key id>` or `dashboard`." }
              live: { type: boolean }
      required: [items]

    Values:
      type: object
      additionalProperties: true

    Rendered:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        kind: { type: string, enum: [free, entry] }
        template_id: { type: [string, "null"], format: uuid }
        published_at: { type: [string, "null"], format: date-time }
        html: { type: string, description: "The page in its layout, sanitized." }
        css: { type: string, description: "Site, layout and page (or template) CSS, in that order." }
        seo: { $ref: "#/components/schemas/Values", description: "The `seo.<name>` values without the prefix." }
        meta: { $ref: "#/components/schemas/Values", description: The client's own values. }
        version: { type: string, description: The ETag without quotes. }
        draft: { type: boolean }
      required: [id, slug, title, kind, html, css, seo, meta, version]

    PageSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        kind: { type: string, enum: [free, entry] }
        template_id: { type: [string, "null"], format: uuid }
        template: { type: [string, "null"], description: The template's name. }
        parent_id: { type: [string, "null"], format: uuid }
        position: { type: integer }
        published_at: { type: [string, "null"], format: date-time }
        fields: { $ref: "#/components/schemas/Values", description: "The field values by name." }
        seo: { $ref: "#/components/schemas/Values" }
        meta: { $ref: "#/components/schemas/Values" }
      required: [id, slug, title, kind, fields, seo, meta]

    PageList:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PageSummary" } }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
      required: [items, page, per_page, total]

    PublicSite:
      type: object
      properties:
        name: { type: string }
        settings: { type: object, additionalProperties: true, description: The site's settings; public. }
        css: { type: string }
        menu:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              slug: { type: string }
              title: { type: string }
              parent_id: { type: [string, "null"], format: uuid }
              position: { type: integer }
        version: { type: string }
      required: [name, settings, css, menu, version]

  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: A key from the Luna dashboard (`sk_live_…`); `pages:write` for the editor.
